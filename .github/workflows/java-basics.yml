name: Java basics (JDK 25)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile separately and check known example outputs
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          while IFS= read -r -d '' source; do
            build_dir="$(mktemp -d)"
            echo "Compiling: $source"
            javac -encoding UTF-8 -d "$build_dir" "$source"
            case "$source" in
              Main.java) expected='我的 Java 已准备好！' ;;
              practice/loops/EvenRunningTotal.java) expected=$'2\n6\n12\n20\n30' ;;
              practice/loops/OddSum.java) expected='25' ;;
              practice/arrays/ArraySum.java) expected='8' ;;
              practice/arrays/EvenCount.java) expected='4' ;;
              practice/arrays/EvenSum.java) expected='6' ;;
              practice/arrays/GreaterThanTenCount.java) expected='4' ;;
              practice/arrays/filtered-stats/Main.java) expected=$'符合条件的元素：12 18 20\n数量：3\n总和：50' ;;
              practice/arrays/ArrayMax.java) expected='-3' ;;
              practice/arrays/ArrayMinMax.java) expected=$'最大值：-3\n最小值：-12' ;;
              *) rm -r -- "$build_dir"; continue ;;
            esac
            class_name="$(basename "$source" .java)"
            printf '%s\n' "$expected" > "$build_dir/expected.txt"
            timeout 10s java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp "$build_dir" "$class_name" < /dev/null > "$build_dir/actual.txt"
            diff -u "$build_dir/expected.txt" "$build_dir/actual.txt"
            echo "PASS: $source"
            rm -r -- "$build_dir"
          done < <(find Main.java practice -type f -name '*.java' -print0)
