name: Java basics (JDK 25)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check document links, anchors and formatting
        run: python3 scripts/check_repo.py
      - name: Check document validator regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check all outputs and array boundaries
        shell: pwsh
        run: ./scripts/check-practice.ps1
